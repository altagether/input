<title>Altadena Theme 1 Round</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Port+Lligat+Sans&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  /* One deliberate look: this mocks a resident page that is light on every device. */
  :root {
    --paper: #fffbf2;
    --ink: #1b1a17;
    --soft: #5b574f;
    --prose: #3a3833;
    --line: #d9d4c7;
    --field-line: #b9b2a2;
    --card: #ffffff;
    --sand: #f0ebe0;
    --flag: #9b2c1f;
    --note: #23485c;
    --note-bg: #e7eff3;
    --display: 'Port Lligat Sans', 'Trebuchet MS', sans-serif;
    --text: 'Source Sans 3', system-ui, -apple-system, sans-serif;
    --figure: 'Source Serif 4', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 17px; line-height: 1.5; }
  a { color: var(--ink); }
  button { font-family: inherit; }

  .bar { background: var(--flag); color: #fff; padding: 9px 16px; text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .tools { background: var(--note-bg); color: var(--note); border-bottom: 1px solid #c4d5de; }
  .tools-in { max-width: 860px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: 14.5px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools .views button[aria-current="page"] { background: var(--note); color: #fff; }
  .tools button { background: #fff; color: var(--note); border: 1px solid var(--note); border-radius: 4px; padding: 6px 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tools button:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; }

  main { max-width: 470px; margin: 0 auto; padding-inline: 20px; padding-block: 0 48px; }
  main.wide { max-width: 860px; }
  .head { padding: 20px 0 16px; border-bottom: 2px solid var(--ink); }
  .logo { display: block; height: 44px; width: auto; margin-bottom: 14px; }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 36px); line-height: 1.14; margin: 6px 0 0; text-wrap: balance; }
  h2 { font-family: var(--figure); font-weight: 600; font-size: 22px; line-height: 1.25; margin: 0 0 10px; text-wrap: balance; }
  .sub { font-size: 15px; color: var(--soft); margin-top: 8px; }
  section { padding-top: 22px; }
  p { margin: 0 0 10px; }
  .small { font-size: 14.5px; color: var(--soft); }

  .progress { padding: 16px 0 0; }
  .progress .lbl { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .track { height: 6px; background: var(--sand); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--ink); width: 0; }

  .glance { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .glance li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .glance b { font-weight: 700; }
  .rows .row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .rows .row b { font-family: var(--figure); font-variant-numeric: tabular-nums; }
  .panel { background: var(--sand); border-radius: 6px; padding: 14px; }

  .pair { display: grid; gap: 8px; }
  .says { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--ink); padding: 12px 14px; font-size: 16px; }
  .says.county { border-left-color: var(--flag); }
  .says .tag { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); margin-bottom: 3px; }
  .says.county .tag { color: var(--flag); }
  .means { font-size: 16.5px; color: var(--prose); margin: 12px 0 0; }
  .cite { font-family: var(--figure); font-size: 13.5px; color: var(--soft); font-variant-numeric: tabular-nums; margin-top: 2px; }

  figure { margin: 14px 0 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 14px; color: var(--soft); margin-top: 8px; }
  .bars { display: flex; gap: 28px; align-items: flex-end; padding: 14px 16px 0; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .bars .col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .bars .b { width: 100%; max-width: 110px; background: var(--sand); border: 2px solid var(--ink); border-bottom: 0; }
  .bars .col.c .b { background: #f3dcd7; border-color: var(--flag); }
  .bars .v { font-family: var(--figure); font-weight: 700; font-size: 17px; }
  .bars .col.c .v { color: var(--flag); }
  .bars .n { font-size: 13.5px; color: var(--soft); text-align: center; padding-bottom: 10px; order: 3; }
  .ground { height: 0; border-top: 2px solid var(--ink); }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
  summary { padding: 12px 14px; font-weight: 600; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; list-style: none; border-radius: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; flex: none; width: 9px; height: 9px; margin: -5px 6px 0 0; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(45deg); transition: transform .15s ease, margin .15s ease; }
  details[open] > summary::after { transform: rotate(-135deg); margin-top: 5px; }
  summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  details > div { padding: 0 14px 14px; color: var(--prose); font-size: 16px; }

  .q { margin-top: 20px; }
  .q > .lbl, .q > label:not(.opt) { font-weight: 700; display: block; margin-bottom: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; min-height: 48px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .opt input { width: 22px; height: 22px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--ink); }
  .opt:has(input:checked) { background: var(--sand); border-color: var(--ink); }
  .opt:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  .says ul { margin: 6px 0 4px 18px; padding: 0; }
  .says li { margin: 4px 0; }
  ul.codes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.codes li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  ul.codes a { font-weight: 600; }
  ul.codes span { display: block; font-size: 14px; color: var(--soft); margin-top: 1px; }
  details ul.codes { border-top: 0; } details ul.codes li:last-child { border-bottom: 0; padding-bottom: 0; }
  .vote { margin-top: 28px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .vote-tag { background: var(--sand); color: var(--soft); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 8px 16px; }
  .vote-body { padding: 16px 16px 18px; }
  .vote .lbl { font-family: var(--figure); font-weight: 600; font-size: 20px; line-height: 1.25; margin-bottom: 14px; text-wrap: balance; }
  .vote .picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .vote .pick { position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; height: 54px; min-height: 0; margin: 0; padding: 0 4px; font-size: 16.5px; font-weight: 600; line-height: 1; border: 1.5px solid var(--field-line); border-radius: 6px; }
  .vote .pick input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; opacity: 0; pointer-events: none; -webkit-appearance: none; appearance: none; }
  .vote .pick .in { display: flex; align-items: center; justify-content: center; gap: 7px; line-height: 1; transform: translateX(-1.5px); }
  .vote .pick .in > span { display: block; line-height: 1; }
  .vote .pick .ic { height: 14px; width: auto; flex: none; display: block; }
  @media (max-width: 430px) { .vote .pick { font-size: 15px; } .vote .pick .ic { height: 12px; } .vote .pick .in { gap: 5px; } .vote-body { padding-inline: 12px; } }
  .vote .pick.agree .ic { color: #2e7d3a; } .vote .pick.disagree .ic { color: #b3261e; } .vote .pick.unsure .ic { color: var(--soft); }
  .vote .pick.agree:has(input:checked) { background: #e7f3e7; border-color: #2e7d3a; color: #1d5426; }
  .vote .pick.disagree:has(input:checked) { background: #fbeae8; border-color: #b3261e; color: #8c1d18; }
  .vote .pick.unsure:has(input:checked) { background: var(--sand); border-color: var(--ink); color: var(--ink); }
  .vote .pick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  .vote .more { margin: 14px 0 0; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { flex: 1 1 100px; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 8px 14px; background: var(--card); border: 1px solid var(--field-line); border-radius: 4px; cursor: pointer; font-size: 17px; }
  .pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--flag); }
  .pick:has(input:checked) { background: #e8e2d2; border-color: var(--ink); font-weight: 600; }
  .pick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  .more { margin: 12px 0 8px; padding: 12px 14px; background: #e8e2d2; border-left: 3px solid var(--flag); }
  .more .lbl2 { font-weight: 600; font-size: 15.5px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips label { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--card); border: 1px solid var(--field-line); border-radius: 4px; font-size: 15.5px; cursor: pointer; }
  .chips input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }

  .rank { display: flex; align-items: center; gap: 12px; min-height: 48px; width: 100%; text-align: left; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 17px; color: var(--ink); }
  .rank .n { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: var(--sand); font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .rank.on { background: var(--sand); border-color: var(--ink); }
  .rank.on .n { background: var(--ink); color: #fff; }
  .rank:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  input[type=text], select, textarea { width: 100%; min-height: 48px; padding: 10px 14px; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--field-line); border-radius: 6px; }
  textarea { resize: vertical; }
  .err { color: var(--flag); font-size: 15px; font-weight: 600; margin-top: 6px; }
  .zonebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--sand); border-radius: 6px; }

  .nav { display: flex; gap: 10px; margin-top: 26px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; flex: 1; background: var(--ink); color: #fff; font-weight: 600; font-size: 18px; border-radius: 6px; border: 2px solid var(--ink); cursor: pointer; padding: 0 16px; }
  .btn.back { flex: 0 0 96px; background: var(--paper); color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }

  .tally { list-style: none; margin: 14px 0 0; padding: 0; background: var(--card); border: 2px solid var(--ink); }
  .tally li { display: flex; justify-content: space-between; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 16px; }
  .tally li:first-child { border-top: 0; }
  .tally .a { font-weight: 600; text-align: right; }
  .foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; text-align: center; }
  .foot a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .test { border: 2px dashed var(--field-line); border-radius: 6px; padding: 16px; margin-top: 22px; }

  /* Captain page */
  .lead { font-size: 19.5px; line-height: 1.45; }
  .zwrap { position: relative; }
  .zwrap select { -webkit-appearance: none; appearance: none; min-height: 56px; padding: 10px 68px 10px 14px; font-size: 18px; font-weight: 600; border: 2px solid var(--ink); border-radius: 6px; background: #fff; cursor: pointer; }
  .zwrap select:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
  .zarrow { position: absolute; top: 0; right: 0; bottom: 0; width: 56px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: #fff; border-radius: 0 6px 6px 0; pointer-events: none; }
  .zarrow svg { width: 24px; height: 24px; display: block; }
  .linkbox { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 16px; display: grid; gap: 12px; justify-items: center; text-align: center; }
  .linkbox .url { font-family: var(--figure); font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .qr { width: 196px; height: 196px; background: #fff; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .msg { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--ink); padding: 12px 14px; font-size: 16px; white-space: pre-line; }
  .btn.slim { min-height: 46px; font-size: 16px; flex: none; width: 100%; }
  ol.steps, ul.plain { margin: 0; padding-left: 20px; } ol.steps li, ul.plain li { margin: 6px 0; }
  .dont { border-left: 3px solid var(--flag); padding: 2px 0 2px 12px; }
  .cardprev { background: #fff; border: 1px solid var(--field-line); padding: 16px; display: grid; grid-template-columns: 1fr 96px; gap: 14px; align-items: center; }
  .cardprev .qr { width: 96px; height: 96px; }
  .cardprev b { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.15; display: block; }

  /* Reports */
  .synth { background: #fff3c9; border: 2px solid #8a6a1f; color: #4d3a0c; padding: 10px 14px; font-weight: 700; font-size: 14.5px; margin-top: 16px; }
  .synth.mini { border-width: 1px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; margin: 0 0 8px; display: inline-block; }
  .dl { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 6px; background: var(--card); text-decoration: none; margin-right: 10px; }
  .dl svg { width: 18px; height: 18px; display: block; }
  .dl:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
  #csvout { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: pre; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin-top: 6px; }
  .facts div { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--card); }
  .facts b { display: block; font-family: var(--figure); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .facts span { font-size: 14px; color: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--prose); margin: 10px 0; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .c-county { background: #9b2c1f; } .c-keep { background: #1b1a17; } .c-other { background: #b08a3e; } .c-unsure { background: #cfc9bb; }
  .brow { display: grid; grid-template-columns: 210px minmax(0, 1fr) 44px; gap: 10px; align-items: center; padding: 5px 0; font-size: 15px; }
  .brow .nm { overflow-wrap: anywhere; } .brow .nn { text-align: right; font-family: var(--figure); font-variant-numeric: tabular-nums; color: var(--soft); }
  .brow.all { font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 9px; margin-bottom: 4px; }
  .stack { display: flex; height: 22px; background: var(--sand); }
  .stack i { display: block; height: 100%; border-right: 2px solid var(--paper); }
  .stack i:last-child { border-right: 0; }
  .finding { font-size: 17.5px; margin: 0 0 4px; }
  .report h2 { margin-top: 8px; padding-top: 18px; border-top: 2px solid var(--ink); }
  .report h3 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 18px 0 6px; }
  .tscroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
  th { text-align: left; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); padding: 0 12px 6px 0; border-bottom: 1px solid var(--field-line); }
  td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { font-family: var(--figure); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  th.num { text-align: right; }
  @media (max-width: 560px) { .brow { grid-template-columns: minmax(0, 1fr) 44px; } .brow .nm { grid-column: 1 / -1; } }

  /* Hover: every clickable thing answers the pointer. Only where a pointer can hover. */
  .btn, .pick, .opt, .rank, .chips label, summary, .tools button, .dl, .zwrap select, .zarrow, select, a { transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
  @media (hover: hover) {
    .btn:hover { background: #3a3833; border-color: #3a3833; }
    .btn.back:hover { background: var(--sand); border-color: var(--ink); }
    .tools button:hover { background: var(--note); color: #fff; }
    .vote .pick:hover { background: #f7f4ec; border-color: var(--ink); }
    .vote .pick.agree:hover { border-color: #2e7d3a; background: #f1f8f1; }
    .vote .pick.disagree:hover { border-color: #b3261e; background: #fdf3f2; }
    .opt:hover, .rank:hover, .chips label:hover { background: #f7f4ec; border-color: var(--ink); }
    summary:hover { background: var(--sand); }
    .zwrap:hover select { background: #f7f4ec; }
    .zwrap:hover .zarrow { background: #3a3833; }
    select:hover { border-color: var(--ink); }
    .dl:hover { background: var(--sand); }
    a:hover { color: var(--flag); }
    .dl:hover { color: var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  #copyout { width: 100%; min-height: 200px; margin-top: 10px; font-size: 14px; }
</style>

</div>

<script>
(function () {

  var WHY_NOW = 'The temporary rules the County put in place after the fire expire in the summer of 2027. The County is studying changes to the permanent rules. The group reviewing them finishes its recommendations in early January 2027. After that, residents can comment on a written draft at public workshops.';

  var MUNI = 'https://library.municode.com/ca/los_angeles_county/codes/code_of_ordinances?nodeId=';

    design: MUNI + 'TIT22PLZO_DIV7STSPUS_CH22.140STSPUS_22.140.520REDEST',
    zones: MUNI + 'TIT22PLZO_DIV3ZO_CH22.18REZO_22.18.040DESTREZO',
    site: MUNI + 'TIT22PLZO_DIV6DEST_CH22.110GESIRE_22.110.070FEWA',
    parking: MUNI + 'TIT22PLZO_DIV6DEST_CH22.112PA_22.112.070REPASP',
    exempt: MUNI + 'TIT22PLZO_DIV6DEST_CH22.112PA_22.112.030EX',

  function a(url, text) { return '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>'; }
  function codeList(items) { return '<ul class="codes">' + items.map(function (i) { return '<li>' + a(i[1], i[0]) + (i[2] ? '<span>' + i[2] + '</span>' : '') + '</li>'; }).join('') + '</ul>'; }
  var ALLCODE = [

    });
    h += '<section><h2>Why neighbors disagreed</h2><p class="small">Across Altadena. We group reasons into themes and never repeat anyone&rsquo;s words.</p><ul class="plain">' + THEMES.slice(0, 4).map(function (x) { return '<li>' + x[0] + '</li>'; }).join('') + '</ul></section>' +
      '<section><h2>Next steps</h2><div class="rows"><div class="row"><b>Oct 15</b><span>These results went to the County&rsquo;s focus group, zone by zone.</span></div><div class="row"><b>Jan 2027</b><span>The group finishes its recommendations.</span></div><div class="row"><b>2027</b><span>The County writes its draft.</span></div></div><p style="margin-top:10px">The County has not responded yet. When it does, we will post it here.</p></section>' +
      '<section><h2>How your answer was handled</h2><p>This page shows counts only. Nobody&rsquo;s individual answer appears here or anywhere else. The County received counts by zone, never names. Your email or number has been deleted.</p></section>' +
      '<section><h2>Next: Round 2</h2><p>The rest of Altadena&rsquo;s building rules open for your input on October 29.</p></section>';
    return h;
  }

  // ---------- Views ----------
  var VIEWS = ['topic', 'form', 'captain', 'county', 'resident'];
  var view = 'topic';
  function setView(v, scroll) {
    if (VIEWS.indexOf(v) < 0) return;
    view = v; state.about = false;
    if (v === 'topic') state.step = 0;
    if (v === 'form' && state.step === 0) state.step = 1;
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
    render(scroll);
  }
  function render(scroll) {
    var foot = '<div class="foot"><a href="#about" data-about="1">More about this survey</a></div>';
    if (view === 'topic' || view === 'form') { view = state.step === 0 ? 'topic' : 'form'; app.innerHTML = state.about ? about() : screen() + foot; }
    else if (view === 'captain') app.innerHTML = captain();
    else if (view === 'county') app.innerHTML = countyReport();
    else app.innerHTML = residentReport();
    app.className = view === 'county' ? 'wide' : '';
    document.querySelectorAll('#views button').forEach(function (b) { if (b.getAttribute('data-view') === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (scroll) window.scrollTo(0, 0);
  }
  document.getElementById('views').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]'); if (!b) return;
    save(); setView(b.getAttribute('data-view'), true);
  });

  app.addEventListener('click', function (e) {
    var dl = e.target.closest('[data-csv]');
    if (dl) {
      e.preventDefault();
      var csv = csvText(), box = document.getElementById('csvbox'), out = document.getElementById('csvout');
      try { var u = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), l = document.createElement('a'); l.href = u; l.download = 'theme-1-example-numbers.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); } catch (err) {}
      out.value = csv; box.hidden = false;
      return;
    }
    var cc = e.target.closest('[data-copycsv]');
    if (cc) {
      var o = document.getElementById('csvout'), w = cc.textContent;
      var fin = function (m) { cc.textContent = m; setTimeout(function () { cc.textContent = w; }, 1600); };
      try { navigator.clipboard.writeText(o.value).then(function () { fin('Copied'); }, function () { o.focus(); o.select(); fin('Selected. Press copy'); }); } catch (err) { o.focus(); o.select(); fin('Selected. Press copy'); }
      return;
    }
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var txt = cp.getAttribute('data-copy'), was = cp.textContent;
      var done = function (m) { cp.textContent = m; setTimeout(function () { cp.textContent = was; }, 1600); };
      try { navigator.clipboard.writeText(txt).then(function () { done('Copied'); }, function () { done('Select the text above to copy'); }); } catch (err) { done('Select the text above to copy'); }
      return;
    }
    var b = e.target.closest('[data-go],[data-rank],[data-restart],[data-about]');
    if (!b) return;
    if (b.hasAttribute('data-about')) { e.preventDefault(); if (!state.about) save(); state.about = b.getAttribute('data-about') === '1'; render(true); return; }
    save();
    if (b.hasAttribute('data-restart')) { state = { step: 0, ans: {}, parts: {}, notes: {}, rank: [], design: '', other: '', zone: '', cross: '', displaced: false, situation: '', talked: '', contact: '', err: '' }; render(true); return; }
    if (b.hasAttribute('data-rank')) { var k = b.getAttribute('data-rank'), i = state.rank.indexOf(k); if (i >= 0) state.rank.splice(i, 1); else state.rank.push(k); render(false); return; }
    var dir = +b.getAttribute('data-go');
    if (dir > 0 && STEPS[state.step] === 'send') {
      var v = state.contact.trim(), ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || v.replace(/\D/g, '').length >= 10;
      if (!ok) { state.err = v ? 'That doesn&rsquo;t look like an email or a 10-digit phone number.' : 'We need one or the other to count your answers once.'; render(false); return; }
    }
    state.err = '';
    state.step = Math.max(0, Math.min(STEPS.length - 1, state.step + dir));
    render(true);
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'czone') { czone = el.value; render(false); return; }
    if (el.type === 'radio' && el.name.indexOf('a-') === 0) { save(); state.ans[el.name.slice(2)] = el.value; render(false); var n = document.getElementById('note-' + el.name.slice(2)); if (n && el.value === 'disagree') n.focus(); }
    else if (el.type === 'radio') { state[el.name] = el.value; }
    else if (el.hasAttribute('data-part')) { var k = el.getAttribute('data-part'), a = state.parts[k] || (state.parts[k] = []), i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i, 1); }
  });

  // Plain-text export of every line a resident would read, for editing elsewhere.
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html.replace(/<li>/g, '\n  - ').replace(/<\/ul>/g, '\n'); return d.textContent.replace(/\n{3,}/g, '\n\n').trim(); }
  function wording() {
    var out = ['ALTADENA THEME 1 ROUND. DRAFT WORDING, ' + 'September 30, 2026', '', 'TITLE', 'Four Altadena building rules that the County may change', '', 'WHY NOW', plain(WHY_NOW), '', 'WHY YOUR VOICE MATTERS', plain(WHY_VOICE), ''];
    TOPICS.forEach(function (t, i) {
      out.push('RULE ' + (i + 1) + ': ' + t.name.toUpperCase(), 'Heading: ' + plain(t.title), 'Today: ' + plain(t.today), 'County is considering: ' + plain(t.county), 'What it means: ' + plain(t.means));
      t.deeper.forEach(function (d) { out.push('Go deeper, ' + plain(d[0]) + ': ' + plain(d[1])); });
      out.push('Question: ' + plain(t.q));
      t.opts.forEach(function (o) { out.push('  - ' + plain(o[1])); });
      out.push('');
    });
    SITUATIONS.forEach(function (g) { out.push('YOUR SITUATION (optional): ' + plain(g[0])); g[1].forEach(function (v) { out.push('  - ' + v); }); out.push(''); });
    out.push('ACROSS THE FOUR', 'Which of these matters most on your block?', '', 'IN YOUR OWN WORDS', 'Is anything in the design rules getting in the way of rebuilding?', 'Anything else the County should know about your block?', '', 'PRIVACY', plain(PRIV));
    return out.join('\n');
  }
  document.getElementById('copy').addEventListener('click', function () {
    var b = this, text = wording();
    function show() { var t = document.getElementById('copyout'); if (!t) { t = document.createElement('textarea'); t.id = 'copyout'; t.readOnly = true; app.appendChild(t); } t.value = text; t.focus(); t.select(); b.textContent = 'Select and copy below'; }
    function ok() { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy survey wording'; }, 1600); }
    try { navigator.clipboard.writeText(text).then(ok, show); } catch (err) { show(); }
  });

  var h0 = (location.hash || '').replace('#', '');
  if (VIEWS.indexOf(h0) >= 0) setView(h0, false); else render(false);
})();
</script>
